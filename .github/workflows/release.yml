name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # 构建机控制台不是中文编码，强制 UTF-8，免得 print 中文时炸掉
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -t .

      - name: 打包（绿色版 zip）
        run: python package.py

      - name: 冒烟自检（cv2 / OCR 是否真的能跑）
        run: |
          # GUI 程序不接管道时 PowerShell 不会等它跑完，所以这里统一走管道取输出
          $out = & .\dist\AssaultLilyBot\AssaultLilyBot.exe --selftest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "自检失败，退出码 $LASTEXITCODE" }
          Get-Content .\dist\AssaultLilyBot\selftest.log -Encoding utf8
        shell: pwsh

      - name: 配置检查（校验打包版能正常读配置）
        run: |
          $out = & .\dist\AssaultLilyBot\AssaultLilyBot.exe --run-main config.json --check 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "配置检查失败，退出码 $LASTEXITCODE" }
        shell: pwsh

      - name: 传 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

      - name: 传构建产物（手动触发时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AssaultLilyBot-windows
          path: dist/*.zip
